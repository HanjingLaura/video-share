<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>视频播放</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b0b;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      main {
        width: min(100%, 960px);
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(20px, 4vw, 28px);
        font-weight: 600;
      }

      video {
        display: block;
        width: 100%;
        max-height: calc(100svh - 100px);
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>视频播放</h1>
      <video controls playsinline preload="metadata">
        <source src="video.mp4" type="video/mp4" />
        你的浏览器不支持视频播放。
      </video>
    </main>
  </body>
</html>
