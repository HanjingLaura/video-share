<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>视频</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #b98b54;
      }

      body {
        position: relative;
        isolation: isolate;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(ellipse at 18% 12%, rgb(244 218 172 / 32%), transparent 38%),
          radial-gradient(ellipse at 78% 82%, rgb(105 66 35 / 18%), transparent 46%),
          linear-gradient(112deg, rgb(255 242 205 / 12%), transparent 42%, rgb(78 45 24 / 8%)),
          #b98b54;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        opacity: 0.42;
        background-image:
          repeating-linear-gradient(
            7deg,
            transparent 0,
            transparent 3px,
            rgb(255 238 201 / 9%) 4px,
            transparent 5px
          ),
          repeating-linear-gradient(
            96deg,
            transparent 0,
            transparent 7px,
            rgb(72 42 22 / 6%) 8px,
            transparent 10px
          ),
          radial-gradient(circle, rgb(67 38 18 / 18%) 0 0.6px, transparent 0.8px),
          radial-gradient(circle, rgb(255 238 199 / 16%) 0 0.7px, transparent 0.9px);
        background-position: 0 0, 0 0, 2px 3px, 9px 11px;
        background-size: auto, auto, 17px 19px, 23px 29px;
        mix-blend-mode: multiply;
      }

      main {
        width: min(100%, 960px);
        box-shadow: 0 18px 50px rgb(73 43 23 / 24%);
      }

      video {
        display: block;
        width: 100%;
        max-height: calc(100dvh - 40px);
        background: #11100e;
      }
    </style>
  </head>
  <body>
    <main>
      <video controls playsinline preload="metadata" aria-label="视频">
        <source src="video.mp4" type="video/mp4" />
        你的浏览器不支持此视频。
      </video>
    </main>
  </body>
</html>
